# docker compose up --build   ->  dashboard on http://localhost:8080
services:
  backend:
    build: .
    init: true                       # tini as PID 1: Ctrl+C / docker stop exits at once
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro      # edit YAML on the host; the backend hot-reloads it
      - lantern-data:/data
    environment:
      # Risk LLM: local Ollama by default, so inspected prompts never leave the machine.
      # Any OpenAI-compatible API works (set these in .env, see .env.example).
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # The model behind the gateway: the local model by default, so the chat gives real answers offline.
      LANTERN_UPSTREAM: ${LANTERN_UPSTREAM:-http://ollama:11434/v1/chat/completions}
      LANTERN_UPSTREAM_KEY: ${LANTERN_UPSTREAM_KEY:-}
      # A separate, smaller chat model: on CPU, sharing the risk model would evict its cached
      # instructions after every chat and slow each risk check from ~3 s to ~20 s. Empty = pass the chosen model through.
      LANTERN_UPSTREAM_MODEL: ${LANTERN_UPSTREAM_MODEL-qwen2.5:1.5b}
      LANTERN_DEMO: ${LANTERN_DEMO:-1}                  # synthetic demo data on first start
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h         # keep the model loaded between prompts
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  ollama-pull:                       # one-shot: download the risk and chat models (~3 GB, first run only)
    image: ollama/ollama:0.12.6
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$0\" && { [ -z \"$$1\" ] || ollama pull \"$$1\"; }",
                 "${LLM_MODEL:-qwen2.5:3b}", "${LANTERN_UPSTREAM_MODEL-qwen2.5:1.5b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  squid:                             # the egress proxy every employee must use
    image: ubuntu/squid:6.10-24.10_edge
    ports:
      - "3128:3128"
    volumes:
      - ./config/squid.conf:/etc/squid/squid.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # optional: reach a service running on the host machine
    restart: unless-stopped

  fake-llm:                          # demo: an AI service no blocklist knows, reachable only through the proxy
    image: python:3.12-slim-bookworm
    command: ["python3", "-u", "/app/fake_llm.py"]
    volumes:
      - ./scripts/fake_llm.py:/app/fake_llm.py:ro
    restart: unless-stopped

  sensor:
    build: ./net_sensor
    init: true                       # forward.sh is a shell; tini passes it the stop signal
    network_mode: "service:squid"    # shares the proxy's network: sees every employee <-> proxy connection
    cap_add: [NET_RAW, NET_ADMIN]
    # Watch only the proxy port: the CONNECT request names the destination, the tunnel carries the traffic shape.
    command: ["-p", "3128", "-f", "tcp port 3128", "-Z", "nobody"]
    volumes:
      - ./config:/config:ro
    environment:
      INGEST_URL: http://backend:8080/ingest
    depends_on:
      squid:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lantern-data:
  ollama-models:
